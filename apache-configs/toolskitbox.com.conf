<VirtualHost *:443>
    ServerName toolskitbox.com
    ServerAlias www.toolskitbox.com

    DocumentRoot /var/www/html/toolsbox-frontend/build
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/toolskitbox.com.crt
    SSLCertificateKeyFile /etc/ssl/private/toolskitbox.com.key
    # If you have a certificate chain file, uncomment the following line
    # SSLCertificateChainFile /etc/ssl/certs/toolskitbox.com.chain.crt
    
    # Modern SSL configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off
    
    <Directory /var/www/html/toolsbox-frontend/build>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # React Router support - Redirect all requests to index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    
    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Cache control for static assets
    <FilesMatch "\.(ico|pdf|jpg|jpeg|png|gif|webp|js|css|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>
    
    # Gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/toolskitbox-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/toolskitbox-ssl-access.log combined
</VirtualHost>
