<VirtualHost *:443>
    ServerName tkb.sh
    ServerAlias www.tkb.sh
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/tkb.sh.crt
    SSLCertificateKeyFile /etc/ssl/private/tkb.sh.key
    # If you have a certificate chain file, uncomment the following line
    # SSLCertificateChainFile /etc/ssl/certs/tkb.sh.chain.crt
    
    # Modern SSL configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off
    
    # URL Shortener Rewrite Rules
    RewriteEngine On
    
    # Forward the short URL code to the Laravel API endpoint
    # Example: https://tkb.sh/k0VDDW -> http://127.0.0.1:8000/api/tools/web/url-shortener/k0VDDW
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]
    
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^/?([a-zA-Z0-9]{1,10})$ http://api.toolskitbox.com/api/tools/web/url-shortener/$1 [P,L]
    
    # Add headers for proxy
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set Host "tkb.sh"
    
    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Cache control for API responses
    <FilesMatch "\.(json)$">
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header set Pragma "no-cache"
    </FilesMatch>
    
    # Gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>
    
    # Disable server signature
    ServerSignature Off

    # Enable HTTP/2
    Protocols h2 http/1.1
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/tkb.sh-error.log
    CustomLog ${APACHE_LOG_DIR}/tkb.sh-access.log combined
    
    # Set environment variables
    SetEnv APP_ENV production
</VirtualHost>
